name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede in-flight runs for the same ref so pushes don't pile up on the
# single self-hosted runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/test.yml@main
    with:
      zip_budget_mb: '0.5'
      # coverage: true          # after `gh secret set CODECOV_TOKEN`
      # blueprint_check: true   # when the repo ships a Playground blueprint
      # integration_suites: '[""]'
      # wp_env_ports: '8890,8891'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
