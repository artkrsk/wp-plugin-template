name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    uses: artkrsk/wordpress-plugin-workflows/.github/workflows/release.yml@main
    with:
      node_version: '24'
      # Strauss is a require-dev package and its tree (symfony/*, league/flysystem)
      # needs PHP 8.1+, so the shared workflow's 8.0 default cannot satisfy the
      # lock. Build toolchain only — the plugin's own floor is set in composer.json.
      php_version: '8.4'
      # The shared workflow installs Node deps only. Without composer install the
      # Strauss post-install hook never runs, and the build fails copying the
      # gitignored vendor-prefixed/ into the release.
      build_command: 'composer install --prefer-dist --no-progress && pnpm build'
      # Auto-detection would match any dev fixture carrying a Plugin Name
      # header — pin both explicitly.
      plugin_slug: '__SLUG__'
      main_plugin_file: 'src/wordpress-plugin/__SLUG__.php'
      assets_directory: '.wordpress-org'
      use_arts_changelog: true
      # Flip to true once the plugin is approved on WordPress.org and the SVN
      # secrets are set (rotate-svn-secrets.sh --add __SLUG__).
      deploy_to_wordpress: false
    secrets:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
